
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS - Personal AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
background:radial-gradient(circle at center,#102b45,#030712 75%);
color:#e8faff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}
.app{width:100%;max-width:500px;padding:25px}
h1{
font-size:48px;
letter-spacing:9px;
color:#42e5ff;
text-shadow:0 0 25px #00bfff;
margin-bottom:5px;
}
.subtitle{color:#8dbdce;letter-spacing:3px;font-size:12px}
.orb{
width:190px;height:190px;
border:2px solid #38dcff;
border-radius:50%;
margin:45px auto 30px;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 30px #00bfff,inset 0 0 30px #00bfff;
animation:pulse 2s infinite alternate;
}
.core{
width:85px;height:85px;
border-radius:50%;
background:#37dfff;
box-shadow:0 0 35px #00cfff;
}
@keyframes pulse{
from{transform:scale(1);opacity:.8}
to{transform:scale(1.06);opacity:1}
}
.status{color:#42e5ff;font-size:14px;letter-spacing:2px}
button{
background:transparent;
border:1px solid #38dcff;
color:#38dcff;
padding:14px 28px;
border-radius:30px;
font-size:16px;
margin:10px;
}
input{
width:90%;
padding:14px;
border:1px solid #38dcff;
border-radius:25px;
background:#0b1928;
color:white;
margin-top:20px;
}
#reply{color:#c6eaf5;margin-top:20px}
</style>
</head>
<body>
<div class="app">
<h1>NEXUS</h1>
<div class="subtitle">PERSONAL AI ASSISTANT</div>
<div class="orb"><div class="core"></div></div>
<div class="status" id="status">SYSTEM ONLINE</div>
<input id="command" placeholder="Talk to NEXUS...">
<br>
<button onclick="activate()">ACTIVATE</button>
<button onclick="listen()">🎙 SPEAK</button>
<div id="reply">Hello! I am NEXUS. Your personal assistant.</div>
</div>
<script>
function activate(){
let q=document.getElementById("command").value.trim();
if(!q){
document.getElementById("reply").innerText="Hello! How can I help you?";
return;
}
document.getElementById("reply").innerText="You said: "+q;
}
function listen(){
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!Speech){
document.getElementById("reply").innerText="Voice recognition is not supported in this browser.";
return;
}
let r=new Speech();
r.lang="hi-IN";
r.onstart=()=>document.getElementById("status").innerText="LISTENING...";
r.onresult=e=>{
let q=e.results[0][0].transcript;
document.getElementById("command").value=q;
document.getElementById("reply").innerText="You said: "+q;
};
r.onerror=()=>document.getElementById("status").innerText="VOICE ERROR";
r.onend=()=>document.getElementById("status").innerText="SYSTEM ONLINE";
r.start();
}
</script>
</body>
</html>
